<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topsellers | NORIKS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; color: #1a1a1a; }
        :root { --topnav-h: 46px; }
        .topnav { background: #0f0f0f; border-bottom: 1px solid #262626; height: var(--topnav-h); display: flex; align-items: stretch; gap: 2px; padding: 0 14px; position: sticky; top: 0; z-index: 200; }
        .topnav .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .3px; padding-right: 18px; margin-right: 6px; }
        .topnav a { display: flex; align-items: center; padding: 0 18px; color: rgba(255,255,255,.62); text-decoration: none; font-size: 13.5px; font-weight: 600; border-bottom: 2px solid transparent; transition: color .15s ease, border-color .15s ease; }
        .topnav a:hover { color: #fff; }
        .topnav a.active { color: #fff; border-bottom-color: #10b981; }

        .header { background: #1a1a1a; color: #fff; padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: var(--topnav-h); z-index: 100; }
        .header h1 { font-size: 19px; font-weight: 600; }
        .header h1 span { color: #10b981; }
        .header .right { display: flex; gap: 14px; align-items: center; font-size: 13px; color: rgba(255,255,255,.75); flex-wrap: wrap; }
        .header .right b { color: #fff; }
        .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-sec { background: #333; color: #fff; } .btn-sec:hover { background: #444; }
        .btn-green { background: #10b981; color: #fff; } .btn-green:hover { background: #059669; }

        .container { max-width: 1240px; margin: 0 auto; padding: 18px 20px 40px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
        .toolbar input[type=search] { flex: 1; min-width: 220px; padding: 9px 12px; border: 1px solid #d8d8d8; border-radius: 8px; font-size: 14px; }
        .toolbar select { padding: 9px 12px; border: 1px solid #d8d8d8; border-radius: 8px; font-size: 14px; background: #fff; }
        .sумmary { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { background: #fff; border: 1px solid #e6e6e6; border-radius: 9999px; padding: 5px 13px; font-size: 12.5px; font-weight: 600; color: #444; }
        .chip b { color: #10b981; }


        /* ── PODMENI izdelkov ── */
        .submenu { background: #fff; border-bottom: 1px solid #e6e6e6; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; position: sticky; top: calc(var(--topnav-h) + 52px); z-index: 90; }
        .submenu button { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 16px; font-size: 13.5px; font-weight: 600; color: #777; cursor: pointer; white-space: nowrap; border-radius: 0; }
        .submenu button:hover { color: #111; }
        .submenu button.active { color: #0f0f0f; border-bottom-color: #10b981; }
        .submenu button .cnt { display: inline-block; margin-left: 6px; background: #f1f5f9; color: #555; border-radius: 9999px; padding: 1px 8px; font-size: 11.5px; }
        .submenu button.active .cnt { background: #d1fae5; color: #047857; }
        /* fiksne sirine, da se polja ne premikajo */
        .toolbar input[type=search] { flex: 0 0 340px; width: 340px; min-width: 340px; }
        .toolbar select { flex: 0 0 200px; width: 200px; min-width: 200px; }


        /* ── INPUTI premium ── */
        .toolbar { align-items: center; }
        .toolbar input[type=search] {
            height: 42px; padding: 0 14px 0 38px; border: 1px solid #dcdcdc; border-radius: 10px;
            font-size: 14px; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>") no-repeat 13px center;
            transition: border-color .16s ease, box-shadow .16s ease;
        }
        .toolbar input[type=search]:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.14); }
        .toolbar select {
            height: 42px; padding: 0 38px 0 14px; border: 1px solid #dcdcdc; border-radius: 10px;
            font-size: 14px; font-weight: 500; color: #1a1a1a; background: #fff;
            -webkit-appearance: none; appearance: none; cursor: pointer;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat; background-position: right 13px center;
            transition: border-color .16s ease, box-shadow .16s ease;
        }
        .toolbar select:hover { border-color: #bdbdbd; }
        .toolbar select:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.14); }
        .toolbar select option { color: #1a1a1a; background: #fff; padding: 8px; }

        .card { background: #fff; border: 1px solid #ececec; border-radius: 12px; overflow: hidden; }
        table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
        thead th { background: #fafafa; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #777; padding: 11px 14px; border-bottom: 1px solid #ececec; white-space: nowrap; }
        tbody td { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        tbody tr:hover td { background: #f9fdfb; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .oid { font-weight: 700; }
        .wcid { color: #667; font-size: 12.5px; white-space: nowrap; }
        .tm { color: #10b981; font-weight: 600; font-variant-numeric: tabular-nums; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 9999px; font-size: 11.5px; font-weight: 600; }
        .st-novo { background: #fef3c7; color: #92600a; }
        .st-prip { background: #dbeafe; color: #1d4ed8; }
        .st-odpr { background: #d1fae5; color: #047857; }
        .st-other { background: #eee; color: #555; }
        .variants { display: flex; flex-wrap: wrap; gap: 5px; }
        .others { display: flex; flex-direction: column; gap: 4px; }
        .oline { font-size: 12.5px; color: #444; line-height: 1.35; }
        .oqty { display: inline-block; min-width: 22px; font-weight: 700; color: #0f766e; font-variant-numeric: tabular-nums; }
        .oname { color: #333; }
        .ovar { color: #777; }
        .onone { color: #bbb; font-size: 12px; font-style: italic; }
        .vpill.plain { background: #eef7f1; color: #17603a; font-weight: 600; }
        .vpill.vwarn { background: #fef3c7; color: #92600a; font-weight: 600; }
        .vpill { background: #f1f5f9; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: #334155; }
        .empty, .loading { text-align: center; padding: 56px 20px; color: #888; }
        .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: #10b981; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes sp { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="topnav">
        <div class="brand">📦 NORIKS</div>
        <a href="/">Majice &amp; Bokserice</a>
        <a href="/topsellers.html" class="active">Topsellers</a>
        <a href="/predpriprava.html">Predpriprava</a>
    </nav>

    <div class="header">
        <h1>📦 <span id="title">KOMPSFIT</span> — naročila za pakiranje</h1>
        <div class="right">
            <div id="sumOrders">Naročil: <b>–</b></div>
            <div id="sumItems">Kosov: <b>–</b></div>
            <div id="sumWarn" style="color:#fbbf24"></div>
            <button class="btn btn-sec" onclick="load()">🔄 Osveži</button>
            <button class="btn btn-green" onclick="exportCsv()">⬇ CSV</button>
        </div>
    </div>

    <div class="submenu" id="submenu"></div>

    <div class="container">
        <div class="toolbar">
            <input type="search" id="q" placeholder="Iskanje: naročilo, kupec, država, velikost…" oninput="render()">
            <select id="fStatus" onchange="load()">
                <option value="Novo">Novo</option>
                <option value="Pripravljen za odpremo">Pripravljen za odpremo</option>
                <option value="Odpremljen">Odpremljen</option>
                <option value="__ALL__" selected>Vsi statusi</option>
            </select>
            <select id="fCountry" onchange="render()"><option value="">Vse države</option></select>
            <div class="summary" id="chips"></div>
        </div>

        <div class="card">
            <div id="body"><div class="loading"><span class="spin"></span>Nalagam…</div></div>
        </div>
    </div>

    <script>
        // Izdelki v podmeniju — vzorci pokrivajo vse jezike trgovin.
        const PRODUCTS = [
            { key: 'KOMPSFIT',  name: 'KOMPSFIT',  hasVar: true,  icon: '🔥', re: /kompsfit|fit\s*kompres/i, not: /(čarap|carap|nogavic|socks|zokni|ponož|skarpet|ciorap)/i },
            { key: 'ORTOPAS', hasVar: false,   name: 'ORTOPAS',   icon: '🎗️', re: /ortopas|ortopedski pojas|pojas za le|derék|záda|plecy|spate|schiena|πλάτ|hrbet|opasek|pas za/i },
            { key: 'KOMZIPS',   name: 'KOMZIPS',   hasVar: true,  icon: '🧦', re: /komzips|kompresijske čarape|zatvarač|kompres.*(zokni|ponož|ciorap|skarpet|calze|κάλτσ)/i },
            { key: 'BUNION', hasVar: false,    name: 'BUNION',    icon: '🦶', re: /bunion|čuklj|cuklj|halux|haluks|bütyök|butyok|alluce|ballen|monturi/i },
            { key: 'FISIOREST', hasVar: false, name: 'FISIOREST', icon: '💆', re: /fisiorest|uređaj za vrat|nyak|krk|szyj|cervical|collo|αυχέν/i },
            { key: 'KNEEFIX', hasVar: false,   name: 'KNEEFIX',   icon: '🦵', re: /kneefix|koleno|kolen|térd|genunchi|kolan|γόνατ|ginocchi|knie/i },
            { key: 'KIDSNEST', hasVar: false,  name: 'KIDSNEST',  icon: '🌙', re: /kidsnest|kidnest|ortopedski jastuk|vzglavnik|párna|polštář|poduszka|perna|cuscino|μαξιλάρ/i }
        ];
        let CURRENT = PRODUCTS[0];
        const matchProduct = (label, p) => p.re.test(label || '') && !(p.not && p.not.test(label || ''));
        const IS_KOMPSFIT = (label) => matchProduct(label, CURRENT);
        const STATUSES = ['Novo', 'Pripravljen za odpremo', 'Odpremljen'];
        const FLAGS = { 'Croatia':'🇭🇷','Slovenia':'🇸🇮','Czech Republic':'🇨🇿','Czechia':'🇨🇿','Poland':'🇵🇱','Greece':'🇬🇷','Italy':'🇮🇹','Hungary':'🇭🇺','Slovakia':'🇸🇰','Romania':'🇷🇴','Germany':'🇩🇪','Bulgaria':'🇧🇬','English':'🌐' };
        let ROWS = [];

        function stClass(s){ s=(s||'').toLowerCase(); if(s.includes('novo'))return 'st-novo'; if(s.includes('priprav'))return 'st-prip'; if(s.includes('odprem'))return 'st-odpr'; return 'st-other'; }

        async function fetchStatus(status) {
            // ISTI vir kot glavna stran (keširano na strežniku) — brez dodatne obremenitve Metakocke
            const r = await fetch('/api/packing/orders?status=' + encodeURIComponent(status) + '&limit=3000&days=5&allshops=1');
            if (!r.ok) return [];
            const j = await r.json();
            return (j.orders || j || []);
        }

        async function load() {
            document.getElementById('body').innerHTML = '<div class="loading"><span class="spin"></span>Nalagam…</div>';
            const sel = document.getElementById('fStatus').value;
            const list = sel === '__ALL__' ? STATUSES : [sel];
            let orders = [];
            for (const st of list) {
                try { orders = orders.concat(await fetchStatus(st)); } catch (e) {}
            }
            // odstrani dvojnike po ID
            const seen = new Set();
            orders = orders.filter(o => { const k = o.id || o._wcRef; if (!k || seen.has(k)) return false; seen.add(k); return true; });

            RAW = orders;
            buildSubmenu();
            computeRows();
        }

        let RAW = [];
        function buildSubmenu() {
            const counts = {};
            PRODUCTS.forEach(p => { counts[p.key] = RAW.filter(o => (o.products || []).some(x => matchProduct(x.label, p))).length; });
            document.getElementById('submenu').innerHTML = PRODUCTS.map(p =>
                '<button class="' + (p.key === CURRENT.key ? 'active' : '') + '" onclick="selectProduct(\'' + p.key + '\')">' +
                p.icon + ' ' + p.name + '<span class="cnt">' + (counts[p.key] || 0) + '</span></button>').join('');
        }
        function selectProduct(key) {
            CURRENT = PRODUCTS.find(p => p.key === key) || PRODUCTS[0];
            document.getElementById('title').textContent = CURRENT.name;
            document.getElementById('q').value = '';
            buildSubmenu();
            computeRows();
        }

        function computeRows() {
            const orders = RAW;
            ROWS = [];
            for (const o of orders) {
                const lines = (o.products || []).filter(p => IS_KOMPSFIT(p.label));
                if (!lines.length) continue;
                let variants = [], qty = 0;
                for (const p of lines) {
                    const items = p.items || [];
                    if (items.length) { if (CURRENT.hasVar === false) { qty += items.length; } else { items.forEach(it => { const cs = [it.color, it.size].filter(Boolean).join(' · '); variants.push(cs ? { t: cs } : { t: 'ni velikosti/barve — preveri ročno', warn: true }); }); qty += items.length; } }
                    else { const m = (p.label||'').match(/\((\d+) kos\)/); const n = m ? parseInt(m[1],10) : 1; qty += n; if (CURRENT.hasVar !== false) variants.push({ t: 'ni velikosti/barve — preveri ročno', warn: true }); }
                }
                // vse ostalo v istem paketu (ne izbrani izdelek)
                const others = [];
                for (const p of (o.products || [])) {
                    if (matchProduct(p.label, CURRENT)) continue;
                    const nm = (p.label || '').replace(/\s*\(\d+[^)]*\)/g, '').replace(/^\s*\d+\s*[x×]\s*/i, '').trim();
                    const its = (p.items || []).map(it => [it.color, it.size].filter(Boolean).join(' · ')).filter(Boolean);
                    const n = (p.items || []).length || 1;
                    others.push({ name: nm, n, its });
                }
                if (CURRENT.hasVar === false) variants = [{ t: qty + '× kos', plain: true }];
                ROWS.push({ others, id: o.id, wcRef: o._wcRef || o.wcRef || '', date: o.orderDate || o.date || '', time: o.orderTime || o.time || '', customer: o.customer || '', country: o.country || '', status: o.status || '', total: o.total || '', currency: o.currency || '', qty, variants });
            }
            ROWS.sort((a,b) => (b.date||'').localeCompare(a.date||''));

            // filtri drzav + povzetek
            const cs = [...new Set(ROWS.map(r => r.country).filter(Boolean))].sort();
            const fc = document.getElementById('fCountry'); const cur = fc.value;
            fc.innerHTML = '<option value="">Vse države</option>' + cs.map(c => '<option value="'+c+'">'+(FLAGS[c]||'')+' '+c+'</option>').join('');
            fc.value = cur;
            const byStatus = ROWS.reduce((m,r) => { m[r.status]=(m[r.status]||0)+1; return m; }, {});
            document.getElementById('chips').innerHTML = Object.entries(byStatus).map(([s,n]) => '<span class="chip">'+s+' <b>'+n+'</b></span>').join('');
            render();
        }

        function filtered() {
            const q = document.getElementById('q').value.toLowerCase().trim();
            const c = document.getElementById('fCountry').value;
            return ROWS.filter(r => {
                if (c && r.country !== c) return false;
                if (!q) return true;
                return (r.id+' '+r.customer+' '+r.country+' '+r.status+' '+r.variants.map(v=>v.t).join(' ')).toLowerCase().includes(q);
            });
        }

        function render() {
            const rows = filtered();
            document.getElementById('sumOrders').innerHTML = 'Naročil: <b>' + rows.length + '</b>';
            document.getElementById('sumItems').innerHTML = 'Kosov: <b>' + rows.reduce((s,r)=>s+r.qty,0) + '</b>';
            const nw = rows.reduce((s,r)=>s+r.variants.filter(v=>v.warn).length,0);
            document.getElementById('sumWarn').innerHTML = nw ? '⚠️ Brez velikosti: <b>' + nw + '</b>' : '';
            if (!rows.length) { document.getElementById('body').innerHTML = '<div class="empty">Ni naročil z ' + CURRENT.name + ' za izbrane pogoje.</div>'; return; }
            let h = '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Naročilo</th><th>WC ID</th><th>Datum in ura</th><th>Kupec</th><th>Država</th><th>Status</th><th>Izbrani izdelek</th><th>Ostalo v paketu</th><th class="num">Kosov</th><th class="num">Znesek</th></tr></thead><tbody>';
            rows.forEach((r,i) => {
                h += '<tr><td class="num">'+(i+1)+'</td>' +
                     '<td class="oid">'+r.id+'</td>' +
                     '<td class="wcid">'+(r.wcRef||'–')+'</td>' +
                     '<td>'+r.date+(r.time?' <span class="tm">'+r.time+'</span>':'')+'</td>' +
                     '<td>'+r.customer+'</td>' +
                     '<td>'+(FLAGS[r.country]||'')+' '+r.country+'</td>' +
                     '<td><span class="badge '+stClass(r.status)+'">'+r.status+'</span></td>' +
                     '<td><div class="variants">'+r.variants.map(v=>'<span class="vpill'+(v.warn?' vwarn':'')+(v.plain?' plain':'')+'">'+(v.warn?'⚠ ':'')+v.t+'</span>').join('')+'</div></td>' +
                     '<td>'+(r.others.length ? '<div class="others">'+r.others.map(o=>'<div class="oline"><span class="oqty">'+o.n+'×</span> <span class="oname">'+o.name+'</span>'+(o.its.length?' <span class="ovar">'+o.its.join(' · ')+'</span>':'')+'</div>').join('')+'</div>' : '&nbsp;')+'</td>' +
                     '<td class="num">'+r.qty+'</td>' +
                     '<td class="num">'+r.total+' '+r.currency+'</td></tr>';
            });
            document.getElementById('body').innerHTML = h + '</tbody></table></div>';
        }

        function exportCsv() {
            const rows = filtered();
            const head = ['Narocilo','WC ID','Datum','Ura','Kupec','Drzava','Status','Velikosti','Ostalo v paketu','Kosov','Znesek','Valuta'];
            const lines = [head.join(',')].concat(rows.map(r => [
                r.id, r.wcRef, r.date, r.time, '"'+(r.customer||'').replace(/"/g,'""')+'"', r.country, r.status,
                '"'+r.variants.map(v=>v.t).join('; ')+'"', '"'+r.others.map(o=>o.n+'x '+o.name+(o.its.length?' ('+o.its.join(' · ')+')':'')).join('; ')+'"', r.qty, r.total, r.currency
            ].join(',')));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
            a.download = CURRENT.key.toLowerCase() + '-narocila.csv';
            a.click();
        }

        load();
    </script>
</body>
</html>
