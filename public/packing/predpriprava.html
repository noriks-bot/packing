<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predpriprava | NORIKS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #1a1a1a; }
        :root { --topnav-h: 46px; }
        .topnav { background: #0f0f0f; border-bottom: 1px solid #262626; height: var(--topnav-h); display: flex; align-items: stretch; gap: 2px; padding: 0 14px; position: sticky; top: 0; z-index: 200; }
        .topnav .brand { display: flex; align-items: center; color: #fff; font-weight: 700; font-size: 14px; padding-right: 18px; margin-right: 6px; }
        .topnav a { display: flex; align-items: center; padding: 0 18px; color: rgba(255,255,255,.62); text-decoration: none; font-size: 13.5px; font-weight: 600; border-bottom: 2px solid transparent; }
        .topnav a:hover { color: #fff; }
        .topnav a.active { color: #fff; border-bottom-color: #10b981; }

        .header { background: #1a1a1a; color: #fff; padding: 13px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; top: var(--topnav-h); z-index: 100; }
        .header h1 { font-size: 19px; font-weight: 600; }
        .header h1 span { color: #10b981; }
        .header .right { display: flex; gap: 14px; align-items: center; font-size: 13px; color: rgba(255,255,255,.75); }
        .header .right b { color: #fff; }
        .btn { border: none; border-radius: 9999px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-sec { background: #333; color: #fff; } .btn-sec:hover { background: #444; }
        .btn-green { background: #10b981; color: #fff; } .btn-green:hover { background: #059669; }

        .container { max-width: 1240px; margin: 0 auto; padding: 20px; }
        .note { color: #666; font-size: 13px; margin-bottom: 16px; }
        .note b { color: #111; }

        .daytabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .daytab { background: #fff; border: 1px solid #e2e2e2; border-radius: 10px; padding: 9px 16px; cursor: pointer;
                  font-size: 13px; font-weight: 600; color: #555; display: flex; flex-direction: column; gap: 2px; min-width: 108px; }
        .daytab:hover { border-color: #10b981; color: #111; }
        .daytab.active { background: #0f0f0f; border-color: #0f0f0f; color: #fff; }
        .daytab .d { font-size: 11px; font-weight: 500; opacity: .7; }
        .daytab .n { font-size: 12.5px; }
        .daytab.active .n { color: #10b981; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
        .card { background: #fff; border: 1px solid #ececec; border-radius: 14px; overflow: hidden; }
        .card h2 { font-size: 15px; font-weight: 700; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .card h2 .tot { background: #eef7f1; color: #17603a; border-radius: 9999px; padding: 3px 12px; font-size: 12.5px; }
        table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
        th { background: #fafafa; text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #777; padding: 9px 14px; border-bottom: 1px solid #ececec; }
        td { padding: 9px 14px; border-bottom: 1px solid #f4f4f4; }
        tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: #f9fdfb; }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
        .sz { display: inline-block; background: #f1f5f9; border-radius: 6px; padding: 1px 8px; font-size: 12px; color: #334155; margin-right: 6px; }
        .cl { color: #444; }
        .tot-row td { background: #fafafa !important; font-weight: 700; }
        .empty, .loading { text-align: center; padding: 50px 20px; color: #888; }
        .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: #10b981; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes sp { to { transform: rotate(360deg); } }
        .warn { background: #fef3c7; color: #92600a; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <nav class="topnav">
        <div class="brand">📦 NORIKS</div>
        <a href="/">Majice &amp; Bokserice</a>
        <a href="/topsellers.html">Topsellers</a>
        <a href="/predpriprava.html" class="active">Predpriprava</a>
    </nav>

    <div class="header">
        <h1>🧾 <span>Predpriprava</span> — kosovnik</h1>
        <div class="right">
            <div id="sumOrders">Naročil: <b>–</b></div>
            <div id="sumPieces">Kosov skupaj: <b>–</b></div>
            <button class="btn btn-sec" onclick="load()">🔄 Osveži</button>
            <button class="btn btn-green" onclick="exportCsv()">⬇ CSV</button>
        </div>
    </div>

    <div class="container">
        <div class="note">Obdobje: <b id="period">zadnji 3 dnevi + danes</b> · vsi statusi (Novo, Pripravljen za odpremo, Odpremljen) · šteto po <b>kosih</b>.</div>
        <div class="daytabs" id="daytabs"></div>
        <div id="warn"></div>
        <div id="body"><div class="loading"><span class="spin"></span>Nalagam…</div></div>
    </div>

    <script>
        // Izdelki BREZ variacij — en sam artikel, zato "brez variacije" ni napaka.
        const NOVAR_GROUPS = ['BUNION','ORTOPAS','FISIOREST','KIDSNEST','KNEEFIX'];
        // Barva je pogosto v imenu izdelka ("Zelene boksarice", "Sive Bokserice - 2XL").
        const NAME_COLORS = [
            [/zelen|green|zöld|zielon|zelen[áé]|verde|πράσιν/i, 'Zelena'],
            [/\bsiv|šedé|šedá|szürke|szary|gri\b|grigio|grau|γκρι|gray|grey/i, 'Siva'],
            [/\bcrn|črn|čiern|černá|fekete|czarn|negru|nero|schwarz|μαύρ|black/i, 'Črna'],
            [/\bbel|bijel|biel|bílá|fehér|biał|alb\b|bianco|weiss|weiß|λευκ|white/i, 'Bela'],
            [/modr|plav|blue|kék|niebiesk|albastru|blu\b|μπλε|darkblue|temno modr/i, 'Modra'],
            [/\bbež|bez\b|beige|bézs|beżow|béžová|bej\b|μπεζ/i, 'Bež'],
            [/rjav|brown|barna|brąz|hnědá|maro|marrone|καφέ/i, 'Rjava']
        ];
        const SIZE_RE = /(?:^|[\s\-–])((?:\d?X)?[SML]{1,2}L?|\d?XL|[SML]\/[SML]|\d{2,3}-\d{2,3})(?=$|[\s,)])/i;
        const isMystery = l => /mystery|iznenađenje|prekvapeni|prekvapenie|překvapení|meglepetés|niespodziank|surpriz|surpris|έκπληξη|sorpresa/i.test(l || '');
        function deriveFromLabel(label) {
            const l = label || '';
            let color = '', size = '';
            for (const [re, name] of NAME_COLORS) if (re.test(l)) { color = name; break; }
            const m = l.match(SIZE_RE);
            if (m) size = m[1].toUpperCase();
            return { color, size };
        }
        const STATUSES = ['Novo', 'Pripravljen za odpremo', 'Odpremljen'];
        let AGG = null, TOTALS = null;

        // razvrsti kos v skupino
        function groupOf(type, label) {
            const t = (type || '').toLowerCase(), l = (label || '').toLowerCase();
            if (/kompsfit|fit\s*kompres/.test(l)) return 'KOMPSFIT';
            if (/kompresijske čarape|zatvarač|komzips/.test(l)) return 'KOMZIPS';
            if (/bunion|čuklj|cuklj|halux|bütyök|alluce|ballen|monturi/.test(l)) return 'BUNION';
            if (/ortopedski pojas|pojas za le|ortopas|derék|záda|plecy|spate|schiena|πλάτ/.test(l)) return 'ORTOPAS';
            if (/fisiorest|uređaj za vrat|nyak|cervical/.test(l)) return 'FISIOREST';
            if (/kneefix|koleno|térd|genunchi|γόνατ/.test(l)) return 'KNEEFIX';
            if (/kidsnest|kidnest|ortopedski jastuk|vzglavnik|párna|poduszka|μαξιλάρ/.test(l)) return 'KIDSNEST';
            if (/nogavic|čarap|carap|socks|zokni|ponož|skarpet|ciorap|calze|κάλτσ/.test(t + ' ' + l)) return 'NOGAVICE';
            if (/boksaric|bokseric|boxer|boxerk|szatyor|alsónadrág|majtki|chilot|slip/.test(t + ' ' + l)) return 'BOKSERICE';
            if (/majic|trič|trick|tricou|póló|koszulk|shirt|magliett|μπλουζ/.test(t + ' ' + l)) return 'MAJICE';
            return 'OSTALO';
        }
        const ORDER = ['MAJICE','BOKSERICE','KOMPSFIT','KOMZIPS','NOGAVICE','ORTOPAS','BUNION','FISIOREST','KIDSNEST','KNEEFIX','OSTALO'];

        async function fetchStatus(status) {
            const r = await fetch('/api/packing/orders?status=' + encodeURIComponent(status) + '&limit=20000');
            if (!r.ok) return [];
            const j = await r.json();
            return (j.orders || j || []);
        }

        async function load() {
            document.getElementById('body').innerHTML = '<div class="loading"><span class="spin"></span>Nalagam…</div>';
            let orders = [];
            for (const st of STATUSES) { try { orders = orders.concat(await fetchStatus(st)); } catch (e) {} }
            const seen = new Set();
            orders = orders.filter(o => { const k = o.id || o._wcRef; if (!k || seen.has(k)) return false; seen.add(k); return true; });

            // zadnji 3 dnevi + danes
            const today = new Date(); const from = new Date(Date.now() - 3 * 86400000);
            const ds = x => x.toISOString().slice(0, 10);
            const fromS = ds(from), toS = ds(today);
            document.getElementById('period').textContent = fromS + ' → ' + toS + ' (4 dni)';
            orders = orders.filter(o => { const d = (o.orderDate || o.date || '').slice(0, 10); return d && d >= fromS && d <= toS; });

            ORDERS = orders;
            buildDayTabs();
            aggregate();
        }

        let ORDERS = [], SELDAY = 'ALL', UNPARSED = [];
        function dayList() {
            const out = [];
            for (let i = 3; i >= 0; i--) out.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
            return out;
        }
        function buildDayTabs() {
            const days = dayList();
            const cnt = {};
            ORDERS.forEach(o => { const d = (o.orderDate || o.date || '').slice(0, 10); cnt[d] = (cnt[d] || 0) + 1; });
            const names = ['Ned','Pon','Tor','Sre','Čet','Pet','Sob'];
            const today = new Date().toISOString().slice(0, 10);
            let html = '<div class="daytab' + (SELDAY === 'ALL' ? ' active' : '') + '" onclick="selectDay(\'ALL\')">' +
                       '<span class="d">Vsi 4 dnevi</span><span class="n">' + ORDERS.length + ' naročil</span></div>';
            days.forEach(d => {
                const dt = new Date(d + 'T12:00:00');
                const lbl = (d === today ? 'DANES' : names[dt.getDay()] + ' ' + dt.getDate() + '.' + (dt.getMonth() + 1) + '.');
                html += '<div class="daytab' + (SELDAY === d ? ' active' : '') + '" onclick="selectDay(\'' + d + '\')">' +
                        '<span class="d">' + lbl + '</span><span class="n">' + (cnt[d] || 0) + ' naročil</span></div>';
            });
            document.getElementById('daytabs').innerHTML = html;
        }
        function selectDay(d) { SELDAY = d; buildDayTabs(); aggregate(); }

        function aggregate() {
            const orders = SELDAY === 'ALL' ? ORDERS : ORDERS.filter(o => (o.orderDate || o.date || '').slice(0, 10) === SELDAY);
            AGG = {}; UNPARSED = []; let pieces = 0, unparsed = 0;
            for (const o of orders) {
                for (const p of (o.products || [])) {
                    const g = groupOf('', p.label);
                    for (const it of (p.items || [])) {
                        const grp = g === 'OSTALO' ? groupOf(it.type, p.label) : g;
                        let col = it.color || '', siz = it.size || '';
                        // 1) izdelki brez variacij -> to NI napaka
                        const noVar = NOVAR_GROUPS.includes(grp);
                        // 2) barvo/velikost poskusi izlusciti iz imena ("Zelene boksarice", "Sive Bokserice - 2XL")
                        if (!noVar && (!col || !siz)) {
                            const d = deriveFromLabel(p.label);
                            if (!col && d.color) col = d.color;
                            if (!siz && d.size) siz = d.size;
                        }
                        // 3) Mystery majica: barva je NAMENOMA neznana
                        const myst = isMystery(p.label);
                        let key;
                        if (noVar) key = 'brez variacije';
                        else if (myst) key = 'Mystery (barva presenečenje)' + (siz ? ' · ' + siz : '');
                        else key = [col, siz].filter(Boolean).join(' · ') || 'brez variacije';
                        AGG[grp] = AGG[grp] || {};
                        AGG[grp][key] = (AGG[grp][key] || 0) + 1;
                        pieces++;
                        if (!noVar && !myst && !col && !siz) {
                            unparsed++;
                            UNPARSED.push({ id: o.id, wc: o._wcRef || '', date: (o.orderDate || o.date || '').slice(0,10),
                                            country: o.country || '', label: (p.label || '').replace(/\s*\(\d+[^)]*\)/g,'').trim(), grp: grp });
                        }
                    }
                }
            }
            TOTALS = { orders: orders.length, pieces };
            document.getElementById('sumOrders').innerHTML = 'Naročil: <b>' + orders.length + '</b>';
            document.getElementById('sumPieces').innerHTML = 'Kosov skupaj: <b>' + pieces + '</b>';
            document.getElementById('warn').innerHTML = unparsed
                ? '<div class="warn">⚠️ ' + unparsed + ' kosov brez razčlenjene variacije — seznam je na dnu strani.</div>' : '';
            render();
        }

        function render() {
            const keys = ORDER.filter(k => AGG[k]).concat(Object.keys(AGG).filter(k => !ORDER.includes(k)));
            if (!keys.length) { document.getElementById('body').innerHTML = '<div class="empty">Ni naročil v tem obdobju.</div>'; return; }
            let html = '<div class="grid">';
            for (const g of keys) {
                const rows = Object.entries(AGG[g]).sort((a, b) => b[1] - a[1]);
                const tot = rows.reduce((s, r) => s + r[1], 0);
                html += '<div class="card"><h2>' + g + '<span class="tot">' + tot + ' kos</span></h2>' +
                        '<table><thead><tr><th>Varianta</th><th class="num">Kosov</th></tr></thead><tbody>';
                rows.forEach(([k, n]) => {
                    const parts = k.split(' · ');
                    const cell = k === 'brez variacije'
                        ? '<span class="cl">brez variacije</span>'
                        : parts.map(p => /^[\dX]*[SMLX]{1,3}L?(\/|$)|^\d{2,3}-\d{2,3}$/i.test(p) ? '<span class="sz">' + p + '</span>' : '<span class="cl">' + p + '</span>').join(' ');
                    html += '<tr><td>' + cell + '</td><td class="num">' + n + '</td></tr>';
                });
                html += '<tr class="tot-row"><td>Skupaj</td><td class="num">' + tot + '</td></tr>';
                html += '</tbody></table></div>';
            }
            html += '</div>';
            if (UNPARSED.length) {
                const byKey = {};
                UNPARSED.forEach(u => {
                    const k = u.id + '|' + u.label;
                    if (!byKey[k]) byKey[k] = { ...u, n: 0 };
                    byKey[k].n++;
                });
                const list = Object.values(byKey).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                html += '<div class="card" style="margin-top:18px"><h2>⚠️ Kosi brez razčlenjene variacije' +
                        '<span class="tot" style="background:#fef3c7;color:#92600a">' + UNPARSED.length + ' kos</span></h2>' +
                        '<div style="overflow-x:auto"><table><thead><tr>' +
                        '<th>Naročilo</th><th>Datum</th><th>Država</th><th>Skupina</th><th>Izdelek</th><th class="num">Kosov</th>' +
                        '</tr></thead><tbody>';
                list.forEach(u => {
                    html += '<tr><td class="oid">' + u.id + (u.wc ? '<div style="color:#999;font-size:11.5px">' + u.wc + '</div>' : '') + '</td>' +
                            '<td>' + u.date + '</td><td>' + u.country + '</td>' +
                            '<td><span class="sz">' + u.grp + '</span></td>' +
                            '<td class="cl">' + u.label + '</td><td class="num">' + u.n + '</td></tr>';
                });
                html += '</tbody></table></div></div>';
            }
            document.getElementById('body').innerHTML = html;
        }

        function exportCsv() {
            if (!AGG) return;
            const lines = ['Skupina,Varianta,Kosov'];
            for (const g of Object.keys(AGG))
                for (const [k, n] of Object.entries(AGG[g]))
                    lines.push([g, '"' + k + '"', n].join(','));
            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'predpriprava-' + (SELDAY === 'ALL' ? 'vsi-dnevi' : SELDAY) + '.csv';
            a.click();
        }

        load();
    </script>
</body>
</html>
