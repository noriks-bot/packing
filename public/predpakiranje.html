<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predpakiranje | NORIKS</title>
<!-- Filtri so v istem slogu kot glavna stran /packing/. -->
<link rel="stylesheet" href="filtri.css">
<style>
    :root { --topnav-h: 46px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           background:#f3f4f6; color:#111827; }
    .topnav { position:fixed; top:0; left:0; right:0; height:var(--topnav-h); background:#111827;
              display:flex; align-items:center; gap:16px; padding:0 14px; z-index:100; }
    .topnav .brand { color:#fff; font-weight:700; font-size:14px; white-space:nowrap; }
    .topnav a { color:rgba(255,255,255,.62); text-decoration:none; font-size:13px; font-weight:600;
                line-height:var(--topnav-h); border-bottom:2px solid transparent; }
    .topnav a:hover { color:#fff; }
    .topnav a.active { color:#fff; border-bottom-color:#10b981; }

    .ovoj { max-width:1400px; margin:0 auto; padding:calc(var(--topnav-h) + 12px) 12px 60px; }
    h1 { font-size:18px; margin:0 0 10px; }
    .stevec { font-size:13px; color:#6b7280; margin:-12px 0 14px 4px; }
    .stevec b { color:#111827; }

    /* Manjsa pisava -> vec stolpcev gre na zaslon; seznam je bil predolg za drsenje. */
    #povzetek { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
                gap:10px; align-items:start; }
    .skupina { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:9px 11px;
               box-shadow:0 1px 2px rgba(0,0,0,.04); break-inside:avoid; }
    .sglava { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
              border-bottom:2px solid #10b981; padding-bottom:4px; margin-bottom:6px; }
    .sime { font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.2px;
            line-height:1.25; }
    .sskupaj { font-weight:800; font-size:12px; color:#10b981; white-space:nowrap; }
    table { width:100%; border-collapse:collapse; }
    td { padding:1px 0; font-size:12px; border-bottom:1px solid #f7f7f8; line-height:1.5; }
    tr:last-child td { border-bottom:0; }
    .kos { width:46px; text-align:right; padding-right:9px; font-weight:800; color:#111827;
           font-variant-numeric:tabular-nums; }
    .barva { display:flex; justify-content:space-between; align-items:baseline;
             margin:7px 0 1px; padding-bottom:2px; border-bottom:1px solid #e5e7eb;
             font-weight:700; font-size:11.5px; color:#374151; }
    .barva:first-child { margin-top:0; }
    .bskupaj { font-weight:600; font-size:11px; color:#9ca3af; }
    .opis { color:#374151; }
    .prazno { text-align:center; color:#6b7280; padding:40px 0; grid-column:1/-1; }
    @media (max-width:560px) { #povzetek { grid-template-columns:1fr; } }
    @media print {
        .topnav, .filters { display:none !important; }
        .ovoj { padding-top:0; max-width:none; }
        #povzetek { grid-template-columns:repeat(3, 1fr); }
        .skupina { box-shadow:none; }
    }
</style>
</head>
<body>
<nav class="topnav">
    <div class="brand">📦 NORIKS</div>
    <a href="/">Pakiranje</a>
    <a href="/predpakiranje" class="active">Predpakiranje</a>
    <a href="/spakirani-paketi">Spakirani paketi</a>
</nav>

<div class="ovoj">
    <h1>🧾 Predpakiranje <span style="font-size:12px; color:#6b7280; font-weight:400;">— koliko česa pripraviti</span></h1>
    <div class="filters">
        <label>Status:</label>
        <div class="country-buttons" id="statusi"></div>
        <label>Država:</label>
        <div class="country-buttons" id="drzave"></div>
    </div>
    <div class="stevec" id="stevec">Nalagam…</div>
    <div id="povzetek"></div>
</div>

<!-- countryFlags pride iz skupne datoteke, da so zastavice povsod iste. -->
<script src="kartica.js"></script>
<script>
    const GLAVNI = ['Novo', 'Pripravljen za odpremo', 'Odpremljen'];
    let izbraniStatusi = new Set(GLAVNI);
    let drzava = '', nalagam = false, pilulePostavljene = false;

    const ubezi = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function parametri() {
        const p = new URLSearchParams();
        if (drzava) p.set('drzava', drzava);
        if (izbraniStatusi.size) p.set('statusi', [...izbraniStatusi].join(','));
        return p.toString();
    }

    function izrisiPilule(d) {
        const st = document.getElementById('statusi');
        const stevec = (ime) => Object.entries(d.poStatusih || {})
            .filter(([k]) => k.startsWith(ime)).reduce((a, [, v]) => a + v, 0);
        st.innerHTML = GLAVNI.map(g =>
            '<button class="country-btn' + (izbraniStatusi.has(g) ? ' active' : '') + '" data-status="' + g + '">' +
            g + '<span class="n">' + stevec(g) + '</span></button>').join('');
        if (pilulePostavljene) return;
        st.addEventListener('click', (e) => {
            const b = e.target.closest('[data-status]'); if (!b) return;
            const s = b.dataset.status;
            if (izbraniStatusi.has(s)) izbraniStatusi.delete(s); else izbraniStatusi.add(s);
            b.classList.toggle('active');
            nalozi();
        });
        const dz = document.getElementById('drzave');
        dz.innerHTML = '<button class="country-btn active">Vse</button>' +
            (d.drzave || []).map(x => '<button class="country-btn" data-drzava="' + ubezi(x.drzava) +
                '" title="' + ubezi(x.drzava) + ' (' + x.n + ')">' +
                (countryFlags[x.drzava] || ubezi(x.drzava)) + '</button>').join('');
        dz.addEventListener('click', (e) => {
            const b = e.target.closest('.country-btn'); if (!b) return;
            drzava = b.dataset.drzava || '';
            dz.querySelectorAll('.country-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            nalozi();
        });
        pilulePostavljene = true;
    }

    function izrisiPovzetek(d) {
        const c = document.getElementById('povzetek');
        if (!d.skupine.length) { c.innerHTML = '<div class="prazno">Ni kosov za pripravo.</div>'; return; }
        c.innerHTML = d.skupine.map(g =>
            '<div class="skupina">' +
                '<div class="sglava"><span class="sime">' + ubezi(g.skupina) + '</span>' +
                '<span class="sskupaj">' + g.skupaj + ' kos</span></div>' +
                g.barve.map(bg =>
                    // Ce izdelek nima barve (npr. Fisiorest), naslova barve ne pisemo.
                    (bg.barva ? '<div class="barva"><span>' + ubezi(bg.barva) + '</span>' +
                                '<span class="bskupaj">' + bg.skupaj + '</span></div>' : '') +
                    '<table>' + bg.velikosti.map(v =>
                        '<tr><td class="kos">' + v.kosov + 'x</td>' +
                        '<td class="opis">' + ubezi(v.velikost) + '</td></tr>'
                    ).join('') + '</table>'
                ).join('') +
            '</div>').join('');
    }

    async function nalozi() {
        if (nalagam) return;
        nalagam = true;
        try {
            // Pilule potrebujejo stevce po statusih, ki jih vraca seznamska koncna tocka;
            // povzetek pa sestevek kosov. Zato dva klica, oba poceni.
            const [rs, rp] = await Promise.all([
                fetch('/api/packing/predpakiranje?' + parametri() + '&naStran=10'),
                fetch('/api/packing/predpakiranje-povzetek?' + parametri())
            ]);
            if (rs.status === 401 || rp.status === 401) { location.href = '/login.html'; return; }
            const ds = await rs.json(), dp = await rp.json();
            izrisiPilule(ds);
            izrisiPovzetek(dp);
            document.getElementById('stevec').innerHTML =
                'Za pripravo: <b>' + dp.kosov.toLocaleString('sl-SI') + '</b> kosov iz <b>' +
                dp.narocil.toLocaleString('sl-SI') + '</b> nespakiranih naročil' +
                (izbraniStatusi.size ? ' (' + [...izbraniStatusi].join(', ') + ')' : '') +
                (drzava ? ' — ' + drzava : '') +
                (dp.narocilBrezPostavk ? ' · ' + dp.narocilBrezPostavk + ' brez razbitih postavk' : '');
        } catch (e) {
            document.getElementById('stevec').textContent = 'Napaka pri nalaganju: ' + e.message;
        } finally { nalagam = false; }
    }

    nalozi();
</script>
</body>
</html>
