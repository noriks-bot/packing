<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spakirani paketi | NORIKS</title>
<!-- Slogi kartice so SKUPNI z /packing/. Popravljaj jih v kartica.css, ne tukaj. -->
<link rel="stylesheet" href="kartica.css">
<style>
    :root { --topnav-h: 46px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
           background:#f3f4f6; color:#111827; }
    .topnav { position:fixed; top:0; left:0; right:0; height:var(--topnav-h); background:#111827;
              display:flex; align-items:center; gap:16px; padding:0 14px; z-index:100; }
    .topnav .brand { color:#fff; font-weight:700; font-size:14px; white-space:nowrap; }
    .topnav a { color:rgba(255,255,255,.62); text-decoration:none; font-size:13px; font-weight:600;
                line-height:var(--topnav-h); border-bottom:2px solid transparent; }
    .topnav a:hover { color:#fff; }
    .topnav a.active { color:#fff; border-bottom-color:#10b981; }

    /* Ta pravila so v index.html ostala vgrajena (njihovi izbirniki se pojavljajo
       tudi drugje na tisti strani), zato jih tu ponovimo — kartica jih rabi. */
    .btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer;
           font-size:14px; font-weight:500; transition:all .2s; }
    .btn-secondary { background:#333; color:#fff; }
    .btn-secondary:hover { background:#444; }
    .src-links { display:flex; gap:6px; margin-top:6px; flex-wrap:nowrap; }
    .src-link { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                font-size:11px; padding:3px 9px; border-radius:5px; text-decoration:none;
                font-weight:600; border:1px solid transparent; }
    .src-wc { background:#f3e8ff; color:#6b21a8; border-color:#e9d5ff; }
    .src-mk { background:#e0f2fe; color:#075985; border-color:#bae6fd; }
    .src-link:hover { filter:brightness(.95); }

    .ovoj { max-width:1400px; margin:0 auto; padding:calc(var(--topnav-h) + 12px) 12px 60px; }
    h1 { font-size:18px; margin:0 0 10px; }
    .orodja { background:#fff; border-radius:10px; padding:10px 12px; margin-bottom:12px;
              box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column; gap:8px; }
    .vrsta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .vrsta label { font-size:12px; color:#6b7280; font-weight:600; }
    input[type=text], input[type=date] { padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
    #isci { flex:1; min-width:180px; }
    .gumb { padding:5px 10px; border:1px solid #e5e7eb; background:#fff; border-radius:999px;
            font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .gumb:hover { background:#f9fafb; }
    .gumb.aktiven { background:#10b981; border-color:#10b981; color:#fff; }
    .stevec { font-size:12px; color:#6b7280; }
    .stevec b { color:#111827; }
    #mreza { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    #vec { display:block; margin:16px auto; padding:10px 22px; border:0; border-radius:8px;
           background:#111827; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
    #vec[disabled] { opacity:.5; cursor:default; }
    .prazno { text-align:center; color:#6b7280; padding:40px 0; grid-column:1/-1; }
    @media (max-width:768px) {
        #mreza { grid-template-columns:1fr; }
        .topnav { flex-wrap:wrap; height:auto; padding:4px 10px; }
        .topnav a { line-height:30px; }
    }
</style>
</head>
<body>
<nav class="topnav">
    <div class="brand">📦 NORIKS</div>
    <a href="/">Pakiranje</a>
    <a href="/predpakiranje">Predpakiranje</a>
    <a href="/spakirani-paketi" class="active">Spakirani paketi</a>
</nav>

<div class="ovoj">
    <h1>📦 Spakirani paketi</h1>
    <div class="orodja">
        <div class="vrsta">
            <input type="text" id="isci" placeholder="Iskanje: ime kupca ali št. naročila…">
            <label>od</label><input type="date" id="od">
            <label>do</label><input type="date" id="doD">
            <button class="gumb" id="pocisti">✕ Počisti</button>
        </div>
        <div class="vrsta" id="drzave"></div>
        <div class="vrsta" id="sortiranje">
            <button class="gumb aktiven" data-sort="novo">🕐 Najnovejši</button>
            <button class="gumb" data-sort="staro">🕐 Najstarejši</button>
            <button class="gumb" data-sort="ime">🔤 A→Ž</button>
            <button class="gumb" data-sort="ime-obr">🔤 Ž→A</button>
            <button class="gumb" data-sort="st">#↑</button>
            <button class="gumb" data-sort="st-obr">#↓</button>
        </div>
        <div class="stevec" id="stevec">Nalagam…</div>
    </div>
    <div id="mreza"></div>
    <button id="vec" style="display:none;">Naloži več</button>
    <div id="konec"></div>
</div>

<!-- ISTI izris kot na /packing/ — ena koda, da se strani ne moreta razhajati. -->
<script src="kartica.js"></script>
<script>
    // Stanje, ki ga skupni izris pričakuje. Tu so vsa naročila spakirana,
    // izbiranja in "novih" ni.
    let spakirani = {};                 // id -> { packedAt }
    window._packingNotes = {};
    window.KARTICA = {
        izbrani:   () => new Set(),
        spakirani: () => spakirani,
        novi:      () => new Set()
    };

    let stran = 0, sort = 'novo', drzava = '', jihJeSe = false, nalagam = false;

    function parametri(zaStran) {
        const p = new URLSearchParams();
        const q = document.getElementById('isci').value.trim();
        const od = document.getElementById('od').value;
        const doD = document.getElementById('doD').value;
        if (q) p.set('q', q);
        if (od) p.set('od', od);
        if (doD) p.set('do', doD);
        if (drzava) p.set('drzava', drzava);
        p.set('sort', sort);
        p.set('stran', zaStran);
        return p.toString();
    }

    // Iz vrstice API-ja naredi naročilo v obliki, ki jo skupni izris pozna.
    function vNarocilo(v) {
        if (v.podrobno) return v.podrobno;
        // Starejše od 30 dni: v bazi ga ni več, zato imamo le ime in čas.
        // Sporočilo damo kot naslov izdelka, da uporabi obstoječi izgled kartice.
        return {
            id: v.id, customer: v.customer || '', country: '', status: '',
            orderDate: '', orderTime: '', total: 0, currency: 'EUR',
            wcId: '', mkId: '', eshop: '', isExchange: false,
            products: [{ label: 'Podrobnosti ni — naročilo je starejše od 30 dni.', code: '', items: [] }]
        };
    }

    async function naloziStran(znova) {
        if (nalagam) return;
        nalagam = true;
        const gumbVec = document.getElementById('vec');
        gumbVec.disabled = true;
        if (znova) { stran = 0; document.getElementById('mreza').innerHTML = ''; spakirani = {}; }
        try {
            const r = await fetch('/api/packing/spakirani?' + parametri(stran));
            if (r.status === 401) { location.href = '/login.html'; return; }
            const d = await r.json();
            d.vrstice.forEach(v => { spakirani[v.id] = { packedAt: v.packedAt }; });
            document.getElementById('mreza').insertAdjacentHTML('beforeend',
                d.vrstice.map(v => renderOrderCard(vNarocilo(v), true)).join(''));
            jihJeSe = d.jihJeSe;
            const prikazanih = document.querySelectorAll('#mreza .order-card').length;
            document.getElementById('stevec').innerHTML =
                'Prikazanih <b>' + prikazanih + '</b> od <b>' + d.skupaj.toLocaleString('sl-SI') + '</b>' +
                (d.skupaj !== d.vsehSpakiranih ? ' (vseh spakiranih ' + d.vsehSpakiranih.toLocaleString('sl-SI') + ')' : '');
            gumbVec.style.display = jihJeSe ? 'block' : 'none';
            if (!prikazanih) document.getElementById('mreza').innerHTML = '<div class="prazno">Ni zadetkov.</div>';
            stran++;
        } catch (e) {
            document.getElementById('stevec').textContent = 'Napaka pri nalaganju: ' + e.message;
        } finally { nalagam = false; gumbVec.disabled = false; }
    }

    // Gumbi na kartici kličejo te funkcije po imenu — enako kot na /packing/.
    async function unpackOrder(orderId) {
        if (!confirm('Vrniti naročilo ' + orderId + ' med nespakirana?')) return;
        try {
            const r = await fetch('/api/packing/unpack', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const k = document.querySelector('.order-card[data-order-id="' + orderId + '"]');
            if (k) k.remove();
        } catch (e) { alert('Ni uspelo: ' + e.message); }
    }
    function toggleOrderSelect() { /* na tej strani se ne izbira */ }
    async function saveNote(orderId) {
        const input = document.querySelector('.order-note-input[data-order-id="' + orderId + '"]');
        if (!input) return;
        const note = input.value.trim();
        try {
            const r = await fetch('/api/packing/notes', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderId, note })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            if (note) window._packingNotes[orderId] = { note, updatedAt: new Date().toISOString() };
            else delete window._packingNotes[orderId];
            const kartica = input.closest('.order-card');
            if (kartica) kartica.classList.toggle('ima-opombo', !!note);
            input.style.borderColor = '#10b981';
            setTimeout(() => { input.style.borderColor = '#ddd'; }, 1000);
        } catch (e) { input.style.borderColor = '#ef4444'; }
    }

    let cakalec = null;
    const odlozeno = () => { clearTimeout(cakalec); cakalec = setTimeout(() => naloziStran(true), 250); };
    document.getElementById('isci').addEventListener('input', odlozeno);
    document.getElementById('od').addEventListener('change', () => naloziStran(true));
    document.getElementById('doD').addEventListener('change', () => naloziStran(true));
    document.getElementById('pocisti').addEventListener('click', () => {
        document.getElementById('isci').value = '';
        document.getElementById('od').value = '';
        document.getElementById('doD').value = '';
        drzava = '';
        document.querySelectorAll('#drzave .gumb').forEach(b => b.classList.toggle('aktiven', !b.dataset.drzava));
        naloziStran(true);
    });
    document.getElementById('sortiranje').addEventListener('click', (e) => {
        const b = e.target.closest('[data-sort]'); if (!b) return;
        sort = b.dataset.sort;
        document.querySelectorAll('#sortiranje .gumb').forEach(x => x.classList.remove('aktiven'));
        b.classList.add('aktiven');
        naloziStran(true);
    });
    document.getElementById('vec').addEventListener('click', () => naloziStran(false));
    new IntersectionObserver(v => { if (v[0].isIntersecting && jihJeSe && !nalagam) naloziStran(false); },
                             { rootMargin: '400px' }).observe(document.getElementById('konec'));

    (async () => {
        try { window._packingNotes = await (await fetch('/api/packing/notes')).json(); } catch (e) {}
        try {
            const d = await (await fetch('/api/packing/spakirani-drzave')).json();
            document.getElementById('drzave').innerHTML =
                '<button class="gumb aktiven">Vse države</button>' +
                d.map(x => '<button class="gumb" data-drzava="' + x.drzava + '">' +
                           (countryFlags[x.drzava] || '') + ' ' + x.drzava + '</button>').join('');
            document.getElementById('drzave').addEventListener('click', (e) => {
                const b = e.target.closest('.gumb'); if (!b) return;
                drzava = b.dataset.drzava || '';
                document.querySelectorAll('#drzave .gumb').forEach(x => x.classList.remove('aktiven'));
                b.classList.add('aktiven');
                naloziStran(true);
            });
        } catch (e) {}
        naloziStran(true);
    })();
</script>
</body>
</html>
